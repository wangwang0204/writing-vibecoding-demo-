<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>內心花園測驗</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #8aab8f;
    --blush: #e8c4b0;
    --cream: #faf6f0;
    --dusk: #6b7fa3;
    --bark: #5c4a3a;
    --mist: #d4dfe8;
    --gold: #c9a96e;
    --text: #3a2e26;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--cream);
    font-family: 'Noto Serif TC', serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(138,171,143,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 80%, rgba(107,127,163,0.14) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(232,196,176,0.12) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .container {
    position: relative; z-index: 1;
    max-width: 680px; margin: 0 auto;
    padding: 60px 24px 80px;
  }

  /* SCREENS */
  .screen { display: none; animation: fadeUp 0.7s ease forwards; }
  .screen.active { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* INTRO */
  .intro-ornament { text-align: center; margin-bottom: 32px; }
  .petal-ring {
    width: 90px; height: 90px; margin: 0 auto 20px;
    animation: slowSpin 20s linear infinite;
  }
  @keyframes slowSpin { to { transform: rotate(360deg); } }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 400; color: var(--bark);
    text-align: center; line-height: 1.3; margin-bottom: 16px;
  }
  h1 em { font-style: italic; color: var(--sage); }
  .subtitle {
    text-align: center; font-size: 0.95rem; color: #7a6a5c;
    line-height: 1.8; max-width: 440px; margin: 0 auto 48px; font-weight: 300;
  }

  /* DIVIDER */
  .divider { display: flex; align-items: center; gap: 12px; margin: 32px 0; }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(to right, transparent, var(--blush), transparent);
  }
  .divider-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }

  /* BUTTON */
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--bark); color: var(--cream);
    border: none; padding: 16px 40px; border-radius: 100px;
    font-family: 'Noto Serif TC', serif; font-size: 1rem;
    cursor: pointer; transition: all 0.3s ease; letter-spacing: 0.05em;
  }
  .btn:hover {
    background: var(--sage); transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(138,171,143,0.35);
  }
  .btn-center { text-align: center; }

  /* PROGRESS */
  .progress-bar-wrap {
    background: var(--mist); border-radius: 100px;
    height: 4px; margin-bottom: 40px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--sage), var(--dusk));
    border-radius: 100px;
    transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  }
  .progress-label {
    text-align: right; font-size: 0.78rem; color: #a0907e;
    margin-bottom: 8px; letter-spacing: 0.08em;
  }

  /* QUESTION */
  .q-number {
    font-size: 0.72rem; letter-spacing: 0.2em; color: var(--gold);
    text-transform: uppercase; margin-bottom: 10px;
  }
  .q-text {
    font-size: clamp(1.1rem, 3vw, 1.35rem); line-height: 1.7;
    color: var(--bark); margin-bottom: 36px; font-weight: 300;
  }

  /* OPTIONS */
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    position: relative;
    border: 1.5px solid rgba(201,169,110,0.25); border-radius: 16px;
    padding: 18px 22px 18px 56px; cursor: pointer;
    transition: all 0.3s ease;
    background: rgba(255,255,255,0.55); backdrop-filter: blur(6px);
  }
  .option:hover {
    border-color: var(--sage); background: rgba(138,171,143,0.08);
    transform: translateX(4px);
  }
  .option.selected { border-color: var(--sage); background: rgba(138,171,143,0.12); }
  .option::before {
    content: attr(data-letter);
    position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 50%;
    border: 1.5px solid var(--blush);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; color: var(--gold);
    font-family: 'Playfair Display', serif; font-style: italic;
    transition: all 0.3s;
  }
  .option.selected::before { background: var(--sage); border-color: var(--sage); color: white; }
  .option-text { font-size: 0.95rem; line-height: 1.6; color: var(--text); font-weight: 300; }

  /* ══════════════════════════════════════════
     RESULT PAGE — redesigned reading flow
  ══════════════════════════════════════════ */

  /* Hero banner — SVG landscape full width */
  .result-hero {
    border-radius: 24px; overflow: hidden;
    margin-bottom: 0;
    box-shadow: 0 12px 40px rgba(92,74,58,0.12);
    position: relative;
  }
  .result-hero svg { display: block; width: 100%; height: auto; }

  /* Type badge overlaid on hero bottom */
  .result-hero-caption {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 28px 28px 22px;
    background: linear-gradient(to top, rgba(30,20,10,0.55) 0%, transparent 100%);
    display: flex; flex-direction: column; gap: 6px;
  }
  .result-tag {
    display: inline-block; align-self: flex-start;
    background: rgba(255,255,255,0.22); backdrop-filter: blur(8px);
    color: rgba(255,255,255,0.92); font-size: 0.72rem;
    padding: 4px 14px; border-radius: 100px; letter-spacing: 0.12em;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .result-type {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.4rem, 4vw, 1.9rem);
    color: #fff; font-weight: 400; line-height: 1.25;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  /* Soul intro — first-person narrative lead */
  .result-soul {
    padding: 32px 0 8px;
    font-size: 1.05rem; line-height: 1.95; color: #4a3c30;
    font-weight: 300; white-space: pre-line;
  }

  /* Affirmation — centred pull-quote */
  .affirmation {
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-size: 1.08rem; font-style: italic;
    color: var(--dusk); line-height: 1.75;
    padding: 28px 20px;
    margin: 8px 0;
    border-top: 1px solid rgba(212,223,232,0.6);
    border-bottom: 1px solid rgba(212,223,232,0.6);
  }
  .affirmation::before { content: '"'; font-size: 2rem; line-height: 0; vertical-align: -0.4em; color: var(--gold); margin-right: 4px; }
  .affirmation::after  { content: '"'; font-size: 2rem; line-height: 0; vertical-align: -0.4em; color: var(--gold); margin-left: 4px; }

  /* Two-column info cards */
  .result-cards {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 14px; margin: 24px 0;
  }
  @media (max-width: 480px) { .result-cards { grid-template-columns: 1fr; } }

  .rcard {
    background: rgba(255,255,255,0.65); border: 1px solid rgba(201,169,110,0.2);
    border-radius: 18px; padding: 22px 20px; backdrop-filter: blur(6px);
  }
  .rcard-full { grid-column: 1 / -1; }
  .rcard h4 {
    font-size: 0.68rem; letter-spacing: 0.2em; color: var(--gold);
    text-transform: uppercase; margin-bottom: 10px;
  }
  .rcard p { font-size: 0.92rem; line-height: 1.85; font-weight: 300; color: #4a3c30; }

  /* Flower section */
  .flower-section {
    background: linear-gradient(135deg, rgba(138,171,143,0.08), rgba(212,223,232,0.12));
    border: 1px solid rgba(138,171,143,0.25);
    border-radius: 20px; padding: 28px 24px; margin: 8px 0;
  }
  .flower-section h4 {
    font-size: 0.68rem; letter-spacing: 0.2em; color: var(--sage);
    text-transform: uppercase; margin-bottom: 18px;
  }
  .flower-row {
    display: flex; align-items: flex-start; gap: 18px; margin-bottom: 16px;
  }
  .flower-svg { flex-shrink: 0; width: 64px; height: 64px; }
  .flower-name-block {}
  .flower-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem; color: var(--bark); margin-bottom: 3px;
  }
  .flower-latin { font-size: 0.73rem; font-style: italic; color: var(--sage); letter-spacing: 0.06em; }
  .flower-desc { font-size: 0.92rem; line-height: 1.85; font-weight: 300; color: #4a3c30; }

  @keyframes floatBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  #sparkle-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
</style>
</head>
<body>

<div class="container">

        <circle cx="45" cy="45" r="10" fill="rgba(255,255,255,0.8)" stroke="rgba(201,169,110,0.4)" stroke-width="1"/>
        <circle cx="45" cy="45" r="4" fill="rgba(201,169,110,0.6)"/>
      </svg>
    </div>
    <h1>你的內心<em>花園</em><br>長什麼樣子？</h1>
    <p class="subtitle">每個人心裡都有一座花園。<br>透過這 15 道直覺題，讓我們輕輕探索<br>你此刻內心最真實的樣子。</p>
    <div class="divider"><div class="divider-dot"></div></div>
    <div class="btn-center">
      <button class="btn" onclick="startQuiz()"><span>踏入花園</span><span>✦</span></button>
    </div>
  </div>

  <!-- QUESTION -->
  <div class="screen" id="screen-question">
    <div class="progress-label" id="progress-label">第 1 題，共 15 題</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="q-number" id="q-number">Question 01</div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options-wrap"></div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">

    <!-- 1. Hero landscape illustration -->
    <div class="result-hero">
      <div id="r-landscape"></div>
      <div class="result-hero-caption">
        <span class="result-tag" id="r-tag"></span>
        <div class="result-type" id="r-type"></div>
      </div>
    </div>

    <!-- 2. Soul description — who you are -->
    <p class="result-soul" id="r-desc"></p>

    <!-- 3. Affirmation pull-quote -->
    <div class="affirmation" id="r-affirmation"></div>

    <!-- 4. Two info cards side by side -->
    <div class="result-cards">
      <div class="rcard">
        <h4>此刻的你</h4>
        <p id="r-now"></p>
      </div>
      <div class="rcard">
        <h4>療癒建議</h4>
        <p id="r-tip"></p>
      </div>
    </div>

    <!-- 5. Flower recommendation -->
    <div class="flower-section">
      <h4>✦ 屬於你的花</h4>
      <div class="flower-row">
        <div class="flower-svg" id="r-flower-svg"></div>
        <div class="flower-name-block">
          <div class="flower-name" id="r-flower-name"></div>
          <div class="flower-latin" id="r-flower-latin"></div>
        </div>
      </div>
      <p class="flower-desc" id="r-flower-desc"></p>
    </div>

    <div class="divider"><div class="divider-dot"></div></div>
    <div class="btn-center">
      <button class="btn" onclick="restartQuiz()">重新探索 ✦</button>
    </div>
  </div>

</div>

function startQuiz() {
  showScreen('screen-question');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('progress-label').textContent = `第 ${currentQ+1} 題，共 ${questions.length} 題`;
  document.getElementById('progress-fill').style.width = `${(currentQ/questions.length)*100}%`;
  document.getElementById('q-number').textContent = `Question ${String(currentQ+1).padStart(2,'0')}`;
  document.getElementById('q-text').textContent = q.text;

  const wrap = document.getElementById('options-wrap');
  wrap.innerHTML = '';
  ['A','B','C','D'].forEach((letter, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.setAttribute('data-letter', letter);
    div.innerHTML = `<div class="option-text">${q.options[i].text}</div>`;
    div.addEventListener('click', () => selectOption(i, div));
    wrap.appendChild(div);
  });
}

function selectOption(index, el) {
  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  const scoreObj = questions[currentQ].options[index].score;
  for (const key in scoreObj) scores[key] += scoreObj[key];
  setTimeout(() => {
    currentQ++;
    if (currentQ < questions.length) renderQuestion();
    else showResult();
  }, 420);
}

function showResult() {
  document.getElementById('progress-fill').style.width = '100%';
  const winner = Object.entries(scores).sort((a,b) => b[1]-a[1])[0][0];
  const r = results[winner];

  document.getElementById('r-landscape').innerHTML = landscapes[winner];
  document.getElementById('r-tag').textContent  = r.tag;
  document.getElementById('r-type').textContent = r.type;
  document.getElementById('r-desc').textContent = r.desc;
  document.getElementById('r-affirmation').textContent = r.affirmation;
  document.getElementById('r-now').textContent  = r.now;
  document.getElementById('r-tip').textContent  = r.tip;
  document.getElementById('r-flower-svg').innerHTML = flowerSVGs[winner];
  document.getElementById('r-flower-name').textContent  = r.flowerName;
  document.getElementById('r-flower-latin').textContent = r.flowerLatin;
  document.getElementById('r-flower-desc').textContent  = r.flowerDesc;

  showScreen('screen-result');
  launchSparkles();
}

function restartQuiz() {
  currentQ = 0;
  scores = { a:0, b:0, c:0, d:0, e:0 };
  showScreen('screen-intro');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function launchSparkles() {
  particles = [];
  for (let i = 0; i < 70; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height * 0.5,
      vx: (Math.random() - 0.5) * 1.5,
      vy: Math.random() * -2 - 0.5,
      r: Math.random() * 3 + 1,
      alpha: 1,
      color: ['#8aab8f','#c9a96e','#e8c4b0','#6b7fa3','#d4dfe8','#f4c0c8'][Math.floor(Math.random()*6)]
    });
  }
  animateSparkles();
}

function animateSparkles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => p.alpha > 0.01);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.alpha -= 0.008;
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.restore();
  });
  if (particles.length > 0) requestAnimationFrame(animateSparkles);
  else ctx.clearRect(0, 0, canvas.width, canvas.height);
}
</script>
